name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pytest
      - name: Unit, USSD, API and data-residency (egress allowlist) tests
        run: python -m pytest -q
      - name: Accuracy and safety regression gate
        run: python eval/regression_gate.py
      - name: Adversarial suite (auth, injection, fuzzing, rate limits, load)
        run: LLM_PROVIDER=none python eval/threat_tests.py | tail -25
      - name: Fail if any adversarial test failed
        run: python -c "import json,sys; s=json.load(open('eval/results/threat_report.json'))['summary']; sys.exit(0 if s['passed']==s['total'] else 1)"
